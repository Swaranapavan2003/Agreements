services:
  - type: web
    name: clm-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clm-db
          property: connectionString
      - key: REDIS_URL
        value: redis://clm-redis:6379/0
      - key: CORS_ORIGINS
        value: "https://clm-frontend.onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_API_KEY
        sync: false

  - type: worker
    name: clm-celery-worker
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clm-db
          property: connectionString
      - key: REDIS_URL
        value: redis://clm-redis:6379/0
      - key: CORS_ORIGINS
        value: "https://clm-frontend.onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_API_KEY
        sync: false

  - type: web
    name: clm-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: pserv
    name: clm-redis
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile.redis

databases:
  - name: clm-db
    plan: free
    postgresMajorVersion: "16"
