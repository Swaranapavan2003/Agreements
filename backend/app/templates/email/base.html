<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ app_name }}</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
.container { max-width: 600px; margin: 40px auto; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.header { background: #4f46e5; padding: 32px; text-align: center; }
.header h1 { color: white; margin: 0; font-size: 24px; }
.body { padding: 40px; color: #333; line-height: 1.6; }
.button { display: inline-block; background: #4f46e5; color: white; padding: 14px 28px; border-radius: 6px; text-decoration: none; font-weight: bold; margin: 24px 0; }
.footer { background: #f9fafb; padding: 24px; text-align: center; color: #9ca3af; font-size: 12px; }
</style></head>
<body>
<div class="container">
  <div class="header"><h1>{{ app_name }}</h1></div>
  <div class="body">{% block content %}{% endblock %}</div>
  <div class="footer">This email was sent by {{ app_name }}. Please do not reply to this email.</div>
</div>
</body></html>
